<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Yazlık: Piksel Ev</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, sıcak, oyuncak gibi; acele yok, sadece inşa etmenin keyfi
   IDEA: Summerhouse tarzı yan görünüm cephe; nehir kıyısında yaşayan küçük bir kasaba dioraması
   PICTURE: tam ekran 8-bit dünya: katmanlı dağlar, yel değirmeni, akan nehir, kuşlar, sallanan ağaçlar
   COLOUR and TYPE: gök mavisi, krem panel, koyu kahve piksel çizgi, mercan vurgu; Pixelify Sans
   LAYOUT: tuval tüm ekran; üstte logo + simgeler, altta araç / kategori / parça şeridi */
:root{color-scheme:light dark;--panel:light-dark(#fff3d6,#262840);--ink:light-dark(#3a2618,#f6e9d2);--line:light-dark(#3a2618,#0b0b16);--shade:light-dark(#e6cf9e,#1a1b2e);--chip:light-dark(#f6dfae,#34375a);--sel:light-dark(#ffd36b,#d99a2b);--acc:#e8664a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#7fc4ef;color:var(--ink);font:16px/1.4 'Pixelify Sans',ui-monospace,monospace;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 10px) max(10px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;z-index:2}
.top>*{pointer-events:auto}
.logo{margin-right:auto;font-size:clamp(24px,6vw,34px);font-weight:600;line-height:1.05;color:#fff8e8;text-shadow:3px 0 0 #3a2618,-3px 0 0 #3a2618,0 3px 0 #3a2618,0 -3px 0 #3a2618,3px 3px 0 #3a2618,5px 5px 0 rgba(58,38,24,.35)}
.btn{font:inherit;font-size:15px;min-height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);color:var(--ink);border:0;margin:3px;box-shadow:0 0 0 3px var(--line),inset -3px -3px 0 var(--shade);cursor:pointer;flex:none}
.btn:active{transform:translateY(2px)}
.btn.on{background:var(--sel)}
.btn:focus-visible,.it:focus-visible,.sw:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
.btn svg{width:20px;height:20px;fill:currentColor;shape-rendering:crispEdges}
.flip svg{transform:scaleX(-1)}
.pop{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 66px);display:none;flex-direction:column;align-items:stretch;background:var(--panel);box-shadow:0 0 0 3px var(--line),6px 6px 0 rgba(58,38,24,.3);padding:8px;z-index:3}
.pop.show{display:flex}.pop .btn{justify-content:flex-start;box-shadow:none;background:transparent}.pop .btn.on{background:var(--sel)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:2;background:var(--panel);box-shadow:0 -3px 0 var(--line),0 -9px 0 rgba(58,38,24,.18);padding:6px max(10px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(10px,env(safe-area-inset-left))}
.row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px}
.row::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.name{margin-left:auto;padding-left:8px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{margin-top:2px}.tabs .btn{font-size:14px;padding:0 10px;min-height:38px;background:var(--chip)}.tabs .btn.on{background:var(--sel)}
.subs{gap:10px;padding:8px 4px 2px}.subs:empty{display:none}
.sw{flex:none;width:34px;height:34px;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 3px var(--line),inset -4px -4px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.18)}
.sw.sel{box-shadow:0 0 0 3px var(--acc),0 0 0 6px var(--line),inset -4px -4px 0 rgba(0,0,0,.22)}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:9px 4px 4px;scroll-snap-type:x proximity}
.it{flex:none;width:60px;height:60px;display:grid;place-items:center;background:var(--chip);border:0;padding:0;box-shadow:0 0 0 3px var(--line),inset -3px -3px 0 var(--shade);cursor:pointer;scroll-snap-align:start}
.it.sel{background:var(--sel);box-shadow:0 0 0 3px var(--acc),inset -3px -3px 0 rgba(0,0,0,.12)}
.it canvas{image-rendering:pixelated;display:block}
.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;background:rgba(20,16,34,.6)}
.modal.show{display:grid}
.card{background:var(--panel);box-shadow:0 0 0 4px var(--line),8px 8px 0 rgba(0,0,0,.3);padding:20px;max-width:min(94vw,720px);text-align:center}
.card h2{margin:0 0 8px;font-size:24px;line-height:1.1}.card p{margin:0 0 14px}
.card img{display:block;max-width:100%;max-height:58vh;margin:0 auto 14px;image-rendering:pixelated;box-shadow:0 0 0 3px var(--line);user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
@media(max-width:460px){.name{display:none}}
.dock.min #tabs,.dock.min #subs,.dock.min #strip{display:none}.dock.min #bHide svg{transform:scaleY(-1)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);z-index:4;background:var(--panel);box-shadow:0 0 0 3px var(--line);padding:10px 14px;font-size:15px;text-align:center;width:max-content;max-width:90vw;transition:opacity .6s}
.slot{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:3px dashed var(--shade);text-align:left}.slot.cur{background:var(--chip)}
.sname{font:inherit;font-size:16px;flex:1 1 120px;min-height:40px;padding:0 8px;border:0;background:var(--panel);color:var(--ink);box-shadow:0 0 0 3px var(--line);user-select:text;-webkit-user-select:text}
.sinfo{font-size:13px;white-space:nowrap;opacity:.8}.slot .btn{min-height:40px;font-size:14px}
#slotList{max-height:56vh;overflow-y:auto;margin:0 0 14px;padding:4px}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:6px}
.toast{z-index:6}
@media(max-width:480px){.top .btn{min-width:40px;padding:0 8px;margin:2px}.logo{font-size:22px}.slot{flex-wrap:wrap}}
.toast.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="İnşa alanı"></canvas>

<header class="top">

  <button class="btn flip" id="bRedo" aria-label="Yinele"><svg viewBox="0 0 8 8"><path d="M2 0h1v1h-1zM1 1h2v1h-2zM0 2h6v1h-6zM1 3h2v1h-2zM2 4h1v1h-1zM6 3h1v3h-1zM3 6h3v1h-3z"/></svg></button>

  <button class="btn" id="bMenu" aria-label="Menü" aria-expanded="false"><svg viewBox="0 0 8 8"><path d="M0 3h2v2h-2zM3 3h2v2h-2zM6 3h2v2h-2z"/></svg></button>

<div class="pop" id="pop">
  <button class="btn" id="bSlots">Kayıtlar</button>

    <button class="btn on" data-tool="place">Yerleştir</button>

    <button class="btn" id="bHide" aria-label="Parça çubuğunu gizle" aria-expanded="true"><svg viewBox="0 0 8 8"><path d="M0 2h2v1h-2zM6 2h2v1h-2zM1 3h2v1h-2zM5 3h2v1h-2zM2 4h4v1h-4zM3 5h2v1h-2z"/></svg></button>
  </div>
  <div class="row tabs" id="tabs"></div>
  <div class="row subs" id="subs"></div>
  <div class="strip" id="strip"></div>
</footer>

<div class="modal" id="mClear"><div class="card"><h2>Her şey silinsin mi?</h2><p>Geri al tuşuyla yine de geri getirebilirsin.</p><button class="btn" id="cNo">Vazgeç</button><button class="btn on" id="cYes">Temizle</button></div></div>
<div class="modal" id="mPhoto"><div class="card"><h2>Kasaban hazır</h2><img id="shot" alt="Kasabanın piksel fotoğrafı"><div class="btnrow"><button class="btn" id="pTown">Tüm kasaba</button><button class="btn" id="pView">Ekrandaki görüntü</button></div><div class="btnrow"><button class="btn on" id="pSave">Kaydet</button><button class="btn" id="pClose">Kapat</button></div></div></div>
<div class="modal" id="mSlots"><div class="card"><h2>Kayıtlar</h2><p>Her kayıt ayrı bir kasaba. Adına dokunup değiştirebilirsin.</p><div id="slotList"></div><button class="btn" id="sClose">Kapat</button></div></div>
<div class="pop" id="wxPop"></div>
<div class="toast" id="toast">Dokun: yerleştir · Sürükle: boya<br>İki parmak: kaydır ve yakınlaştır</div>

<script>
{
const T=16,W=160,GROUND=56,GY=GROUND*T,RIV0=GY+46,RIV1=GY+94,KEY='yazlik-v2',DX=5,DY=-3,DS=5;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const hs=n=>{n=(n^61)^(n>>>16);n=n+(n<<3);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return n>>>0};
const LIGHT=new Set(['#ffd75e','#fff1b0','#fff6c8','#ffe58a'].map(h=>parseInt(h.slice(1),16)));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renk tonlama: 0 gündüz, 1 gün batımı, 2 gece ---------- */
function tpx(r,g,b,m,side,lit){if(m===1){r=r*.9+24;g=g*.74+10;b=b*.66+20}else if(m===2&&!lit){r=r*.42+8;g=g*.46+10;b=b*.62+34}if(side){r*=.64;g*=.66;b*=.78}return[r,g,b]}
const TC={};function tc(h,m){const k=h+m;if(TC[k])return TC[k];const n=parseInt(h.slice(1),16);const [r,g,b]=tpx(n>>16,n>>8&255,n&255,m,false,false);return TC[k]=`rgb(${r|0},${g|0},${b|0})`}
function tint(src,m,side){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.drawImage(src,0,0);const d=g.getImageData(0,0,c.width,c.height),a=d.data;
  for(let i=0;i<a.length;i+=4){if(!a[i+3])continue;const lit=LIGHT.has(a[i]<<16|a[i+1]<<8|a[i+2]);const f=lit?1:1+((hs(i>>2)%9)-4)*.013;const [r,gg,b]=tpx(a[i]*f,a[i+1]*f,a[i+2]*f,m,side,lit);a[i]=r;a[i+1]=gg;a[i+2]=b}g.putImageData(d,0,0);return c}
function mk(w,h,draw,n,flip){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');if(flip){g.translate(w,0);g.scale(-1,1)}const r=(x,y,a,b,col)=>{g.fillStyle=col;g.fillRect(x,y,a,b)};draw(r,n,g);return c}
const circ=(r,cx,cy,rad,c)=>{for(let y=Math.floor(cy-rad);y<=cy+rad;y++)for(let x=Math.floor(cx-rad);x<=cx+rad;x++)if((x-cx)**2+(y-cy)**2<=rad*rad)r(x,y,1,1,c)};
const gl=n=>n?['#ffd75e','#fff1b0']:['#8cc8ec','#d6effc'];

/* ---------- parçalar ---------- */
const P=[],PM={};
const add=(id,name,cat,w,h,layer,draw,o={})=>{const p={id,name,cat,w,h,layer,draw,...o};P.push(p);PM[id]=p};

[['plaster','Krem sıva','#f0dfbd','#d6c094','#fbf0d8','plaster'],['white','Beyaz badana','#f4f1ea','#d9d4c8','#ffffff','plaster'],['yellow','Sarı sıva','#f2d27a','#d4b055','#fbe6a8','plaster'],['pink','Pembe sıva','#efb5ad','#cf8c84','#fbd3cc','plaster'],
 ['brick','Kırmızı tuğla','#b4533c','#7e3426','#cf6e52','brick'],['wbrick','Beyaz tuğla','#e9e4da','#c4bdae','#fbf8f2','brick'],['stone','Taş','#a7a39a','#6f6b63','#c9c5bb','stone'],['concrete','Beton','#b9b6ae','#9a978f','#cfccc4','concrete'],
 ['wood','Ahşap','#a26c3c','#6e4423','#c08850','plank'],['darkwood','Koyu ahşap','#6b4428','#4a2d19','#87593a','plank'],['log','Kütük','#9a6a3f','#6a4425','#c08a56','log'],['tudor','Ahşap karkas','#f0e2c4','#5a3a22','#fbf0d8','tudor'],
 ['blue','Mavi lambri','#6e9fca','#4a76a0','#94bfe2','siding'],['mint','Nane lambri','#8fceb0','#5fa383','#b5e6cd','siding'],['lilac','Lila lambri','#b9a6d6','#9280b4','#d3c6ea','siding'],['scale','Pul kaplama','#7fb6c9','#5a8fa3','#a6d3e2','scale']
].forEach(([k,name,b,d,l,kind])=>add('w-'+k,name,'Duvar',1,1,0,r=>{
  r(0,0,16,16,b);
  if(kind==='brick')for(let row=0;row<4;row++){const y=row*4;r(0,y,16,1,l);r(0,y+3,16,1,d);for(let x=row%2?4:0;x<16;x+=8)r(x,y,1,3,d)}
  if(kind==='plaster')for(let i=0;i<14;i++)r(hs(i*3+1)%16,hs(i*5+7)%16,1,1,i%2?d:l);
  if(kind==='plank')for(let row=0;row<4;row++){const y=row*4;r(0,y,16,1,l);r(0,y+3,16,1,d);r((row*7+3)%16,y,1,3,d)}
  if(kind==='siding')for(let row=0;row<4;row++){r(0,row*4,16,1,l);r(0,row*4+3,16,1,d)}
  if(kind==='log')for(let row=0;row<4;row++){const y=row*4;r(0,y,16,1,l);r(0,y+3,16,1,d);r(0,y+1,1,2,d);r(15,y+1,1,2,l)}
  if(kind==='tudor'){r(0,0,2,16,d);r(0,7,16,2,d);for(let i=0;i<7;i++)r(2+i,i,2,1,d);for(let i=0;i<7;i++)r(13-i,9+i,2,1,d)}
  if(kind==='concrete'){r(0,15,16,1,d);r(15,0,1,16,d);[[4,4],[11,4],[4,11],[11,11]].forEach(([x,y])=>r(x,y,1,1,d));r(0,0,15,1,l)}
  if(kind==='scale')for(let row=0;row<4;row++){const y=row*4;for(let x=row%2?-4:0;x<16;x+=8){r(x+1,y+3,6,1,d);r(x,y+1,1,2,d);r(x+7,y+1,1,2,d);r(x+2,y,3,1,l)}}
  if(kind==='stone'){r(0,0,16,16,d);[[0,0,8,6],[8,0,8,6],[0,6,5,5],[5,6,8,5],[13,6,3,5],[0,11,10,5],[10,11,6,5]].forEach(([x,y,w,h])=>{r(x,y,w-1,h-1,b);r(x,y,w-1,1,l)})}
}));

const RMAT=[['red','Kırmızı','#c2492f','#8c2f1f','#e0694a','#5e1e14','tile'],['terra','Turuncu','#de7a3a','#a95424','#f39a5a','#6e3314','tile'],['slate','Arduvaz','#5c6577','#3a4150','#7d889c','#262b36','slate'],['blue','Mavi','#3f6fb0','#2b4f85','#6d97d4','#1b3358','tile'],['green','Yeşil metal','#4f9a6a','#336b48','#72bd8a','#21452f','metal'],
 ['purple','Mor','#7a5aa0','#563d78','#9c7cc4','#3a2752','slate'],['shingle','Ahşap şindıra','#9c6a3c','#6e4423','#bf8a55','#43280f','shingle'],['thatch','Saman','#d9b25a','#a8843a','#f0d27e','#7a5a20','thatch'],['copper','Bakır','#5fb3a0','#3f8c7a','#8ad6c4','#25594d','metal'],['black','Siyah','#3a3a44','#24242c','#56566a','#121218','shingle']];
const RSH=[['full','düz',()=>true],['l','sol eğim',(x,y)=>x>=15-y],['r','sağ eğim',(x,y)=>x<=y],['la','sol yatık alt',(x,y)=>y>=15-x/2],['lb','sol yatık üst',(x,y)=>y>=7-x/2],['rb','sağ yatık üst',(x,y)=>y>=7-(15-x)/2],['ra','sağ yatık alt',(x,y)=>y>=15-(15-x)/2],['eave','saçak',(x,y)=>y>=9]];
function rpat(k,x,y,b,d,l){
  if(k==='tile'){const o=(y>>2)%2?2:0;return y%4===3||(x+o)%4===0?d:y%4===0?l:b}
  if(k==='slate'){const o=(y>>2)%2?3:0;return y%4===3||(x+o)%6===0?d:y%4===0&&(x+o)%6<3?l:b}
  if(k==='shingle'){const row=Math.floor(y/3),o=hs(row)%5;return y%3===2||(x+o)%5===0?d:y%3===0?l:b}
  if(k==='metal')return x%4===0?l:x%4===3?d:b;
  const v=hs(x*7+(y>>3))%4;return v===0||(y%5===4&&v===2)?d:v===1?l:b}

  const E=(x,y)=>x<0||x>15?true:m(x,y);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){if(!m(x,y))continue;let c=rpat(kind,x,y,b,d,l);
    if(s!=='full'&&(!E(x-1,y)||!E(x+1,y)||!E(x-2,y)||!E(x+2,y)||!m(x,y-1)||!m(x,y-2)))c=e;if(s==='eave'&&y>=14)c=d;r(x,y,1,1,c)}
},{sub:k})));


const TOPE={};RMAT.forEach(([k])=>RSH.forEach(([s,,m])=>{const e=[];for(let x=0;x<16;x++){let y=0;while(y<16&&!m(x,y))y++;e.push(y<16?y:-1)}TOPE['r-'+k+'-'+s]=e}));
[['w','beyaz','#f6f2e6','#c9c1ab'],['g','yeşil','#3f7d55','#2b583b'],['b','kahve','#7a4e2d','#553419'],['r','kırmızı','#b8453a','#8a3029'],['u','mavi','#3f6fb0','#2b4f85']].forEach(([k,name,f,fs])=>add('win-'+k,'Pencere, '+name,'Pencere',1,1,2,(r,n)=>{
  const [G,H]=gl(n);r(2,2,12,11,f);r(4,4,8,8,G);r(7,4,2,8,f);r(4,7,8,2,f);r(5,5,2,1,H);r(10,9,1,2,H);r(1,13,14,2,fs)},{lit:1}));
const WF='#f6f2e6',WS='#c9c1ab';

function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));$('selName').textContent=t==='place'?PM[sel].name:t==='erase'?'En üstteki parçayı siler':'Sürükleyerek gez'}
const refit=()=>{const old=dockPx;dockPx=$('dock').offsetHeight*dpr;camY+=(dockPx-old)/S;clampCam()};
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;renderTabs();renderStrip();$('strip').scrollLeft=0;refit()});
$('subs').addEventListener('click',e=>{const b=e.target.closest('[data-mat]');if(!b)return;rmat=b.dataset.mat;const shape=PM[sel].sub?sel.split('-').pop():'full';sel=`r-${rmat}-${shape}`;renderTabs();renderStrip();setTool('place');beep(760,.04)});
$('strip').addEventListener('click',e=>{const b=e.target.closest('.it');if(!b)return;sel=b.dataset.id;document.querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x===b));setTool('place');beep(880,.04);if(innerWidth<=460)showToast(PM[sel].name)});
document.querySelector('.tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)});
function doUndo(){if(!undo.length)return;redo.push(clone(items));items=undo.pop();save();beep(300,.06)}
function doRedo(){if(!redo.length)return;undo.push(clone(items));items=redo.pop();save();beep(400,.06)}
$('bUndo').onclick=doUndo;$('bRedo').onclick=doRedo;
$('bMode').onclick=()=>{mode=(mode+1)%3;setModeIcon();save();beep([660,440,260][mode],.12);showToast(MNAME[mode])};
const closeMenu=()=>{$('pop').classList.remove('show');$('bMenu').setAttribute('aria-expanded','false')};
$('bMenu').onclick=()=>{const s=$('pop').classList.toggle('show');$('bMenu').setAttribute('aria-expanded',s)};
$('bGrid').onclick=()=>{grid=!grid;$('bGrid').classList.toggle('on',grid)};
$('bSnd').onclick=()=>{snd=!snd;$('bSnd').classList.toggle('on',snd)};
$('bClear').onclick=()=>{closeMenu();$('mClear').classList.add('show')};
$('cNo').onclick=()=>$('mClear').classList.remove('show');
$('cYes').onclick=()=>{if(items.length){undo.push(clone(items));redo=[];items=[];save()}$('mClear').classList.remove('show');beep(150,.2)};
$('bPhoto').onclick=()=>{let x0=70,x1=100,y0=46;items.forEach((o,i)=>{const p=PM[o.id];if(!i){x0=o.x;x1=o.x+p.w;y0=o.y}x0=Math.min(x0,o.x);x1=Math.max(x1,o.x+p.w);y0=Math.min(y0,o.y)});
  x0=Math.max(0,x0-4);x1=Math.min(W,x1+4);y0=Math.max(0,y0-6);const hpx=GY+112-y0*T,s=Math.max(2,Math.min(5,Math.floor(2400/((x1-x0)*T))));
  const c=document.createElement('canvas');c.width=(x1-x0)*T*s;c.height=hpx*s;scene(c.getContext('2d'),s,x0*T,y0*T,c.width,c.height,{});
  $('shot').src=c.toDataURL('image/png');$('mPhoto').classList.add('show');beep(990,.05)};
$('pClose').onclick=()=>$('mPhoto').classList.remove('show');
/* ---------- yeni: fotoğraf kaydetme ---------- */
$('pTown').onclick=()=>$('bPhoto').onclick();
$('pView').onclick=()=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;scene(c.getContext('2d'),S,camX,camY,c.width,c.height,{});$('shot').src=c.toDataURL('image/png');beep(990,.05)};
$('pSave').onclick=()=>{const u=$('shot').src;if(!u)return;try{if(window.Android&&window.Android.saveImage){const r=window.Android.saveImage(u.split(',')[1]);showToast(r==='ok'?'Galeriye kaydedildi (Resimler/Yazlik)':r==='izin'?'İzin verip tekrar dene':'Kaydedilemedi');beep(r==='ok'?1200:200,.08);return}}catch(e){}
const a=document.createElement('a');a.href=u;a.download='yazlik-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';document.body.appendChild(a);a.click();a.remove();showToast('Fotoğraf indirildi');beep(1200,.08)};
/* ---------- yeni: hava durumu ---------- */
const WXI=['<path d="M3 1h2v1h-2zM2 2h4v4h-4zM3 6h2v1h-2zM1 3h1v2h-1zM6 3h1v2h-1z"/>','<path d="M2 2h3v1h-3zM1 3h6v1h-6zM0 4h8v2h-8z"/>','<path d="M2 0h3v1h-3zM1 1h6v1h-6zM0 2h8v2h-8zM1 5h1v1h-1zM4 5h1v1h-1zM7 5h1v1h-1zM2 7h1v1h-1zM5 7h1v1h-1z"/>','<path d="M3 0h2v8h-2zM0 3h8v2h-8zM1 1h1v1h-1zM6 1h1v1h-1zM1 6h1v1h-1zM6 6h1v1h-1z"/>','<path d="M2 0h3v1h-3zM1 1h6v1h-6zM0 2h8v2h-8zM4 4h2v1h-2zM3 5h2v1h-2zM4 6h1v1h-1zM3 7h1v1h-1z"/>','<path d="M0 1h7v1h-7zM1 3h7v1h-7zM0 5h7v1h-7zM1 7h6v1h-6z"/>'];
function setWxIcon(){$('icoWx').innerHTML=WXI[WX];$('bWx').setAttribute('aria-label','Hava durumu: '+WXN[WX]);$('bWx').classList.toggle('on',WX>0);document.querySelectorAll('[data-wx]').forEach(b=>b.classList.toggle('on',+b.dataset.wx===WX))}
function setWx(i){WX=i;save();setWxIcon();showToast('Hava: '+WXN[i]);beep([700,520,400,880,200,600][i],.1)}
$('wxPop').innerHTML=WXN.map((n,i)=>`<button class="btn" data-wx="${i}"><svg viewBox="0 0 8 8">${WXI[i]}</svg>${n}</button>`).join('');
const closeWx=()=>{$('wxPop').classList.remove('show');$('bWx').setAttribute('aria-expanded','false')};
$('wxPop').addEventListener('click',e=>{const b=e.target.closest('[data-wx]');if(!b)return;setWx(+b.dataset.wx);closeWx()});
$('bWx').onclick=()=>{closeMenu();const s=$('wxPop').classList.toggle('show');$('bWx').setAttribute('aria-expanded',s)};
$('bMenu').addEventListener('click',closeWx);cv.addEventListener('pointerdown',closeWx);
/* ---------- yeni: kayıt yuvaları ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function slotInfo(i){try{const s=JSON.parse(localStorage.getItem(skey(i)));if(s&&Array.isArray(s.items))return s}catch(e){}return null}
function renderSlots(){$('slotList').innerHTML=Array.from({length:NSLOT},(_,i)=>{const cur=i===slot,s=cur?{items}:slotInfo(i);
return `<div class="slot${cur?' cur':''}"><input class="sname" data-i="${i}" maxlength="24" value="${esc(slotName(i))}" aria-label="Kayıt adı"><span class="sinfo">${cur?'Açık · ':''}${s?s.items.length+' parça':'Boş'}</span>${cur?'':s?`<button class="btn" data-load="${i}">Aç</button><button class="btn" data-del="${i}">Sil</button>`:`<button class="btn" data-new="${i}">Boş başla</button><button class="btn" data-demo="${i}">Örnek</button>`}</div>`}).join('')}
function loadSlot(i,fresh){save();slot=i;const s=fresh?null:slotInfo(i);if(s){items=s.items.filter(o=>PM[o.id]&&Number.isInteger(o.x)&&Number.isInteger(o.y));mode=[0,1,2].includes(s.mode)?s.mode:0;WX=Number.isInteger(s.wx)&&s.wx>=0&&s.wx<6?s.wx:0}else{items=fresh==='demo'?sample():[];WX=0}
undo=[];redo=[];saveSL();save();setModeIcon();setWxIcon();renderSlots();showToast(slotName(i)+' açıldı');beep(700,.06);setTimeout(()=>beep(950,.06),70)}
$('slotList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.load)loadSlot(+d.load);else if(d.new)loadSlot(+d.new,'empty');else if(d.demo)loadSlot(+d.demo,'demo');
else if(d.del){if(d.sure){try{localStorage.removeItem(skey(+d.del))}catch(e){}SL.names[+d.del]='';saveSL();renderSlots();beep(150,.15)}else{d.sure='1';b.textContent='Emin misin?';b.classList.add('on')}}});
$('slotList').addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('sname'))return;SL.names[+t.dataset.i]=t.value.slice(0,24);saveSL()});
$('bSlots').onclick=()=>{closeMenu();renderSlots();$('mSlots').classList.add('show')};
$('sClose').onclick=()=>$('mSlots').classList.remove('show');

let toastT;const hideToast=()=>{clearTimeout(toastT);$('toast').classList.add('hide')};
const showToast=txt=>{$('toast').textContent=txt;$('toast').classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(hideToast,1400)};
toastT=setTimeout(hideToast,6000);
const setDock=min=>{$('dock').classList.toggle('min',min);$('bHide').setAttribute('aria-expanded',!min);$('bHide').setAttribute('aria-label',min?'Parça çubuğunu göster':'Parça çubuğunu gizle');try{localStorage.setItem('yazlik-dock',min?'1':'0')}catch(e){}};
$('bHide').onclick=()=>{setDock(!$('dock').classList.contains('min'));refit();beep(500,.04)};
try{if(localStorage.getItem('yazlik-dock')==='1')setDock(true)}catch(e){}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
  if(e.ctrlKey||e.metaKey)return;if(k==='b')setTool('place');if(k==='e')setTool('erase');if(k==='h')setTool('pan');if(k==='n')$('bMode').click();if(k==='g')$('bGrid').click();if(k==='w')setWx((WX+1)%6)});
addEventListener('resize',()=>resize(false));

renderTabs();renderStrip();setTool('place');setModeIcon();setWxIcon();resize(true);loop();
}
</script>
</body>
</html>
