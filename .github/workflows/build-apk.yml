name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android projesini hazırla
        run: |
          A=android/app/src/main
          mkdir -p $A/assets $A/java/com/yazlik/ev $A/res/drawable
          cp index.html $A/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "YazlikEv"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          echo "org.gradle.jvmargs=-Xmx2g" > android/gradle.properties

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.yazlik.ev'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.yazlik.ev'
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName '1.${{ github.run_number }}'
              }
              signingConfigs {
                release {
                  if (System.getenv("KS_FILE")) {
                    storeFile file(System.getenv("KS_FILE"))
                    storePassword System.getenv("KS_PASS")
                    keyAlias 'yazlik'
                    keyPassword System.getenv("KS_PASS")
                  }
                }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig System.getenv("KS_FILE") ? signingConfigs.release : signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:label="Yazlık"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cp icon.png $A/res/drawable/ic_launcher.png

          cat > $A/java/com/yazlik/ev/MainActivity.java <<'EOF'
          package com.yazlik.ev;

          import android.app.Activity;
          import android.content.Intent;
          import android.Manifest;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(web);
                  hideBars();
                  if (state == null) web.loadUrl("file:///android_asset/index.html");
                  else web.restoreState(state);
              }

              @SuppressWarnings("deprecation")
              private void hideBars() {
                  web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }

              public class Bridge {
                @JavascriptInterface
                public void shareText(String text) {
                  runOnUiThread(() -> {
                    Intent i = new Intent(Intent.ACTION_SEND);
                    i.setType("text/plain");
                    i.putExtra(Intent.EXTRA_TEXT, text);
                    startActivity(Intent.createChooser(i, "Kasaba kodunu paylaş"));
                  });
                }
                @JavascriptInterface
                public String saveImage(String b64) {
                  try {
                    byte[] data = Base64.decode(b64, Base64.DEFAULT);
                    String name = "Yazlik-" + System.currentTimeMillis() + ".png";
                    if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, name);
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
                      v.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/Yazlik");
                      Uri uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) return "hata";
                      try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(data); }
                    } else {
                      if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                        runOnUiThread(() -> requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1));
                        return "izin";
                      }
                      File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES), "Yazlik");
                      dir.mkdirs();
                      File f = new File(dir, name);
                      try (FileOutputStream os = new FileOutputStream(f)) { os.write(data); }
                      MediaScannerConnection.scanFile(MainActivity.this, new String[]{f.getAbsolutePath()}, new String[]{"image/png"}, null);
                    }
                    return "ok";
                  } catch (Exception e) {
                    return "hata";
                  }
                }
              }
          }
          EOF

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yazlik.jks"
            echo "KS_FILE=$RUNNER_TEMP/yazlik.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret bulunamadı, geçici debug imzası kullanılıyor"
          fi

      - name: APK derle
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: APK dosyasını adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk Yazlik-Piksel-Ev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Yazlik-Piksel-Ev-apk
          path: Yazlik-Piksel-Ev.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Yazlık Piksel Ev v1.${{ github.run_number }}
          body: Telefona indirip kurmak için aşağıdaki Yazlik-Piksel-Ev.apk dosyasına dokun.
          files: Yazlik-Piksel-Ev.apk
